name: deploy
on: [push, workflow_dispatch]

defaults:
      run:
        working-directory: launchpad

jobs:
  test:
    runs-on: ubuntu-latest    
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - run: npm clean-install
      - run: npm run test


# tambah di bawah sekali
permissions:
  pages: write
  id-token: write